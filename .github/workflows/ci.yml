name: Test and Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: npm ci
      - run: npm test
      - run: python -m unittest backend.test_app backend.test_predictors backend.test_telemetry
      - run: npm run build
      - run: python scripts/check_docs.py
      - run: git diff --check